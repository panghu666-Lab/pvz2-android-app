name: Build PVZ2 Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Extract resources
      run: python3 -c "import zipfile;zin=zipfile.ZipFile('resources.zip','r');zout=zipfile.ZipFile('resources_fixed.zip','w');[setattr(item,'filename',item.filename.replace(chr(92),'/')) or zout.writestr(item,zin.read(item)) for item in zin.infolist()];zout.close();zin.close();print('Fixed zip')" && unzip -q resources_fixed.zip -d resources/ && echo "Resources extracted"

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential zlib1g-dev ncurses-dev libncurses5-dev libncursesw5-dev libtinfo5 libffi-dev libssl-dev automake libtool pkg-config
        pip3 install --upgrade pip
        pip3 install buildozer cython==0.29.36 virtualenv

    - name: Modify buildozer.spec
      run: |
        sed -i 's/^android.archs.*/android.archs = arm64-v8a/' buildozer.spec
        sed -i 's/^log_level.*/log_level = 2/' buildozer.spec
        sed -i 's/^requirements.*/requirements = python3==3.11.9,kivy,requests,charset_normalizer==3.3.2,colorama,idna,urllib3,certifi/' buildozer.spec
        echo "Modified buildozer.spec"
        grep -E "^(android.archs|log_level|requirements)" buildozer.spec

    - name: Build APK
      run: |
        cd $GITHUB_WORKSPACE
        yes | buildozer android debug
      env:
        ANDROID_HOME: /opt/android-sdk
        ANDROID_NDK_HOME: /opt/android-ndk

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: PVZ2-Android-APK
        path: bin/*.apk
        retention-days: 30
